name: Vote

# GitHub kills jobs after 6h, so each run loops for 5h45 then exits cleanly;
# the next scheduled run takes over. concurrency prevents two loops overlapping.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: vote
  cancel-in-progress: false

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Keeps the WON browser session between runs so we don't log in every time
      - uses: actions/cache@v4
        with:
          path: .data
          key: won-data-${{ github.run_id }}
          restore-keys: won-data-
      - name: Run worldofnations
        run: |
          timeout 345m npx tsx src/cli.ts run worldofnations --loop || code=$?
          # 124 = stopped by timeout, the expected end of every run
          if [ "${code:-0}" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
        env:
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          CAPSOLVER_APP_ID: ${{ secrets.CAPSOLVER_APP_ID }}
          CAPSOLVER_PROXY: ${{ secrets.CAPSOLVER_PROXY }}
          WON_EMAIL: ${{ secrets.WON_EMAIL }}
          WON_PASSWORD: ${{ secrets.WON_PASSWORD }}
          WON_USERNAME: ${{ secrets.WON_USERNAME }}
          HEADLESS: "true"
